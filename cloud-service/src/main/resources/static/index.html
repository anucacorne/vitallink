<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VitalLink — Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0A0B0F;
            color: #E5E7EB;
            min-height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 28px; background: #0D0F14;
            border-bottom: 1px solid #1A1D26;
            position: sticky; top: 0; z-index: 50;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            width: 34px; height: 34px; border-radius: 10px;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .header-title { font-size: 17px; font-weight: 700; color: #F0F0F2; }
        .header-sub { font-size: 11px; color: #4B5563; margin-left: 8px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .nav-tabs { display: flex; align-items: center; gap: 4px; }
        .nav-tab {
            padding: 7px 18px; border-radius: 8px; border: none;
            background: transparent; color: #6B7280;
            font-size: 13px; font-weight: 400; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .nav-tab.active { background: #1E2028; color: #F0F0F2; font-weight: 600; }
        .btn-refresh {
            background: #1A1D26; border: 1px solid #2E3040; border-radius: 8px;
            padding: 7px 14px; color: #9CA3AF; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            font-size: 12px; font-family: inherit;
        }
        .btn-refresh:hover { background: #1E2028; }
        .user-badge {
            width: 32px; height: 32px; border-radius: 8px;
            background: #10B98120; color: #10B981;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }
        .time-label { font-size: 11px; color: #4B5563; }

        /* Main */
        .main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

        /* Stats row */
        .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat-card {
            background: #111318; border: 1px solid #1E2028; border-radius: 14px;
            padding: 22px 24px; flex: 1; min-width: 160px;
            position: relative; overflow: hidden;
        }
        .stat-card .glow {
            position: absolute; top: -20px; right: -20px;
            width: 80px; height: 80px; border-radius: 50%;
        }
        .stat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .stat-label {
            font-size: 12px; color: #6B7280; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        .stat-value { font-size: 32px; font-weight: 700; color: #F0F0F2; letter-spacing: -0.02em; }
        .stat-sub { font-size: 12px; color: #4B5563; margin-top: 4px; }

        /* Panels */
        .panel {
            background: #111318; border: 1px solid #1E2028; border-radius: 14px;
            overflow: hidden;
        }
        .panel-header {
            padding: 14px 20px; border-bottom: 1px solid #1E2028;
            font-size: 13px; font-weight: 600; color: #9CA3AF;
            display: flex; align-items: center; gap: 8px;
        }
        .panel-body { padding: 20px; }
        .panel-body.scroll { max-height: 480px; overflow-y: auto; }

        /* Overview grid */
        .overview-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
        .map-container { height: 480px; }
        .map-inner { height: calc(100% - 48px); }
        #transport-map { width: 100%; height: 100%; border-radius: 0 0 12px 12px; }

        /* Alert row */
        .alert-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; border-radius: 10px; margin-bottom: 8px;
        }
        .alert-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .alert-content { flex: 1; min-width: 0; }
        .alert-msg { font-size: 13px; font-weight: 600; color: #E5E7EB; margin-bottom: 3px; }
        .alert-meta { display: flex; gap: 12px; font-size: 11px; color: #6B7280; }
        .alert-meta .sev { font-weight: 600; }
        .alert-type-badge {
            font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
            background: #1E2028; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .btn-ack {
            background: transparent; border-radius: 8px;
            padding: 6px 14px; font-size: 12px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            font-family: inherit; transition: all 0.15s;
        }
        .btn-ack:hover { opacity: 0.8; }
        .badge-count {
            background: #EF444420; color: #EF4444;
            font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
        }

        /* Transport row */
        .transport-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; background: #111318;
            border: 1px solid #1E2028; border-radius: 10px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .transport-row:hover { background: #161920; }
        .transport-row.selected { background: #1A1D26; }
        .transport-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .transport-info { flex: 1; min-width: 0; }
        .transport-name { font-size: 13px; font-weight: 600; color: #E5E7EB; margin-bottom: 4px; }
        .transport-route { font-size: 11px; color: #6B7280; display: flex; align-items: center; gap: 4px; }
        .transport-right { text-align: right; flex-shrink: 0; }
        .status-badge {
            font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px;
            display: inline-block; margin-bottom: 4px;
        }
        .transport-temp { font-size: 11px; color: #4B5563; display: flex; align-items: center; gap: 3px; justify-content: flex-end; }

        /* Transport detail */
        .detail-panel {
            background: #111318; border: 1px solid #1E2028;
            border-radius: 14px; padding: 24px; margin-top: 12px;
        }
        .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .detail-icon {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .detail-title { font-size: 16px; font-weight: 700; color: #F0F0F2; }
        .detail-status { font-size: 12px; font-weight: 600; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
        .field-label {
            font-size: 11px; color: #6B7280; text-transform: uppercase;
            letter-spacing: 0.06em; margin-bottom: 3px;
        }
        .field-value { font-size: 14px; color: #E5E7EB; font-weight: 500; margin-bottom: 12px; }
        .field-value .urgency { font-weight: 700; }

        /* Telemetry */
        .telemetry-section { margin-top: 20px; }
        .telemetry-header {
            font-size: 13px; font-weight: 600; color: #9CA3AF;
            margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
        }
        .telemetry-list { max-height: 240px; overflow-y: auto; }
        .telemetry-row {
            display: grid; grid-template-columns: 90px 70px 60px 60px 1fr;
            align-items: center; gap: 8px;
            padding: 8px 12px; border-radius: 6px; font-size: 12px;
        }
        .telemetry-row.even { background: #0D0F14; }
        .telemetry-time { color: #6B7280; }
        .telemetry-temp { font-weight: 600; }
        .telemetry-coords { color: #4B5563; }
        .temp-ok { color: #10B981; }
        .temp-warn { color: #EF4444; }

        /* Transports view grid */
        .transports-grid { display: grid; gap: 20px; }
        .transports-grid.with-detail { grid-template-columns: 1fr 1fr; }
        .section-header {
            font-size: 13px; font-weight: 600; color: #9CA3AF;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }

        /* Footer */
        .footer {
            padding: 16px 28px; border-top: 1px solid #1A1D26;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: #374151;
        }

        /* Loading & Error */
        .center-msg {
            display: flex; align-items: center; justify-content: center;
            height: 300px; color: #4B5563; text-align: center;
        }
        .error-msg { color: #EF4444; }
        .error-detail { font-size: 13px; color: #6B7280; margin: 8px 0 16px; }
        .error-hint { font-size: 12px; color: #4B5563; }
        .btn-retry {
            margin-top: 16px; padding: 10px 24px; background: #1E2028;
            border: 1px solid #2E3040; border-radius: 8px; color: #E5E7EB;
            font-size: 13px; cursor: pointer; font-family: inherit;
        }

        .empty-state {
            background: #111318; border: 1px solid #1E2028; border-radius: 14px;
            padding: 60px; text-align: center; color: #4B5563; font-size: 14px;
        }

        /* Leaflet popup override */
        .leaflet-popup-content-wrapper {
            background: #1A1D26 !important; color: #E5E7EB !important;
            border-radius: 10px !important; border: 1px solid #2E3040 !important;
        }
        .leaflet-popup-tip { background: #1A1D26 !important; }

        @media (max-width: 900px) {
            .overview-grid { grid-template-columns: 1fr; }
            .transports-grid.with-detail { grid-template-columns: 1fr; }
            .stats-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-left">
        <div class="logo-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </div>
        <div>
            <span class="header-title">VitalLink</span>
            <span class="header-sub">Monitorizare logistică medicală</span>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" data-view="overview">Prezentare</button>
        <button class="nav-tab" data-view="transports">Transporturi</button>
        <button class="nav-tab" data-view="alerts">Alerte</button>
    </div>
    <div class="header-right">
        <span class="time-label" id="last-refresh"></span>
        <button class="btn-refresh" id="btn-refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
        </button>
        <div class="user-badge">D</div>
    </div>
</header>

<!-- Main content -->
<main class="main" id="main-content">
    <div class="center-msg">
        <div>
            <div style="font-size:14px;margin-bottom:4px;">Se încarcă datele...</div>
            <div style="font-size:12px;">Conectare la backend</div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <span>VitalLink &copy; 2026 — Monitorizare logistică medicală critică</span>
    <span>Spring Boot 3.x &middot; Java 21 &middot; Apache Kafka &middot; PostgreSQL</span>
</footer>

<script>
    // ═══════════════════════════════════════════════════════════
    // VitalLink Dashboard v2 — Updated for new schema
    // ═══════════════════════════════════════════════════════════

    const API = '/api';
    let token = null;
    let state = {
        stats: null,
        transports: [],
        alerts: [],
        allAlerts: [],
        selectedTransport: null,
        currentView: 'overview',
        telemetry: [],
        showAcknowledged: false,
    };

    // ─── SVG ICONS ───────────────────────────────────────────
    const svg = {
        truck: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
        alert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        activity: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
        pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        thermo: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>',
        check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
        clock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        building: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22V18h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/></svg>',
        car: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>',
    };

    // ─── CONFIG MAPS (schema nouă) ───────────────────────────
    // category din resource_profiles
    const CATEGORY_CFG = {
        ORGAN:                      { label: 'Organ',                    color: '#EF4444', bg: '#EF444418' },
        BLOOD_PRODUCT:              { label: 'Produs sanguin',           color: '#DC2626', bg: '#DC262618' },
        BIOLOGICAL_SAMPLE:          { label: 'Probă biologică',          color: '#F59E0B', bg: '#F59E0B18' },
        VACCINE:                    { label: 'Vaccin',                   color: '#8B5CF6', bg: '#8B5CF618' },
        THERMOSENSITIVE_MEDICATION: { label: 'Medicament termosensibil', color: '#3B82F6', bg: '#3B82F618' },
    };
    const STATUS_CFG = {
        SCHEDULED:  { label: 'Programat',  color: '#8B5CF6', bg: '#8B5CF618' },
        IN_TRANSIT: { label: 'În tranzit', color: '#10B981', bg: '#10B98118' },
        DELIVERED:  { label: 'Livrat',     color: '#6B7280', bg: '#6B728018' },
        CANCELLED:  { label: 'Anulat',     color: '#EF4444', bg: '#EF444418' },
        INCIDENT:   { label: 'Incident',   color: '#F59E0B', bg: '#F59E0B18' },
    };
    const SEV_CFG = {
        CRITICAL: { color: '#EF4444', bg: '#EF444420', border: '#EF444440' },
        HIGH:     { color: '#F59E0B', bg: '#F59E0B20', border: '#F59E0B40' },
        MEDIUM:   { color: '#3B82F6', bg: '#3B82F620', border: '#3B82F640' },
        LOW:      { color: '#10B981', bg: '#10B98120', border: '#10B98140' },
    };
    const URGENCY_CFG = {
        ULTRA_CRITICAL: { label: 'Ultra-critic', color: '#EF4444' },
        CRITICAL:       { label: 'Critic',       color: '#F59E0B' },
        HIGH:           { label: 'Ridicat',      color: '#F97316' },
        STANDARD:       { label: 'Standard',     color: '#3B82F6' },
        LOW:            { label: 'Scăzut',       color: '#10B981' },
    };

    // ─── HELPER: extract data from nested schema ─────────────
    function rp(t) { return t.resourceProfile || {}; }
    function fo(t) { return t.facilityOrigin || {}; }
    function fd(t) { return t.facilityDestination || {}; }
    function ve(t) { return t.vehicle || {}; }
    function dr(t) { return t.driver || {}; }

    function getCat(t) {
        const cat = rp(t).category || 'ORGAN';
        return CATEGORY_CFG[cat] || { label: cat, color: '#888', bg: '#88888818' };
    }
    function getStat(t) {
        return STATUS_CFG[t.status] || { label: t.status, color: '#888', bg: '#88888818' };
    }
    function getUrgency(t) {
        const u = t.priorityOverride || rp(t).urgency || 'STANDARD';
        return URGENCY_CFG[u] || { label: u, color: '#888' };
    }

    // ─── AUTH ────────────────────────────────────────────────
    async function login() {
        const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'dispatcher', password: 'dispatch123' }),
        });
        if (!res.ok) throw new Error('Login failed');
        token = (await res.json()).token;
    }

    function authH() {
        return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    // ─── FETCH ALL DATA ──────────────────────────────────────
    async function fetchAll() {
        try {
            if (!token) await login();
            const [statsR, transR, alertsR] = await Promise.all([
                fetch(`${API}/dashboard/stats`, { headers: authH() }),
                fetch(`${API}/transports`, { headers: authH() }),
                fetch(`${API}/alerts`, { headers: authH() }),
            ]);
            if (!transR.ok) throw new Error('Fetch failed');
            state.stats = await statsR.json();
            state.transports = await transR.json();
            state.alerts = await alertsR.json();
            document.getElementById('last-refresh').textContent =
                new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
            render();
        } catch (e) {
            document.getElementById('main-content').innerHTML = `
            <div class="center-msg">
                <div>
                    <div class="error-msg" style="font-size:18px;font-weight:600;margin-bottom:8px;">Eroare conexiune</div>
                    <div class="error-detail">${e.message}</div>
                    <div class="error-hint">Asigură-te că backend-ul rulează pe localhost:8080</div>
                    <button class="btn-retry" onclick="fetchAll()">Reîncearcă</button>
                </div>
            </div>`;
        }
    }

    // ─── ACKNOWLEDGE ALERT ───────────────────────────────────
    async function ackAlert(id) {
        if (!token) return;
        try {
            await fetch(`${API}/alerts/${id}/acknowledge?acknowledgedBy=dispatcher`, {
                method: 'PUT', headers: authH(),
            });
            // Marchează ca acknowledged în ambele liste
            const alert = state.alerts.find(a => a.id === id);
            if (alert) alert.acknowledged = true;
            const alertAll = state.allAlerts.find(a => a.id === id);
            if (alertAll) alertAll.acknowledged = true;
            state.alerts = state.alerts.filter(a => !a.acknowledged);
            if (state.stats) state.stats.unacknowledgedAlerts--;
            render();
        } catch (e) { console.error(e); }
    }

    // ─── TOGGLE ACKNOWLEDGED ─────────────────────────────────
    async function toggleAcknowledged() {
        state.showAcknowledged = !state.showAcknowledged;
        if (state.showAcknowledged && state.allAlerts.length === 0) {
            try {
                const res = await fetch(`${API}/alerts/all`, { headers: authH() });
                if (res.ok) state.allAlerts = await res.json();
            } catch (e) { console.error(e); }
        }
        render();
    }

    // ─── SELECT TRANSPORT ────────────────────────────────────
    async function selectTransport(id) {
        if (state.selectedTransport?.id === id) {
            state.selectedTransport = null;
            state.telemetry = [];
        } else {
            state.selectedTransport = state.transports.find(t => t.id === id);
            try {
                const res = await fetch(`${API}/transports/${id}/telemetry`, { headers: authH() });
                state.telemetry = res.ok ? await res.json() : [];
            } catch { state.telemetry = []; }
        }
        render();
    }

    // ─── MAP ─────────────────────────────────────────────────
    let mapInstance = null;

    function renderMap(transports) {
        setTimeout(() => {
            const el = document.getElementById('transport-map');
            if (!el || !window.L) return;
            if (mapInstance) { mapInstance.remove(); mapInstance = null; }

            const map = L.map('transport-map', { zoomControl: false }).setView([46.0, 25.0], 7);
            mapInstance = map;
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OSM &copy; CARTO', maxZoom: 19,
            }).addTo(map);

            const pts = [];
            transports.forEach(t => {
                const c = getCat(t);
                const s = getStat(t);
                const origin = fo(t);
                const dest = fd(t);
                const profile = rp(t);

                // Origine marker
                if (origin.latitude && origin.longitude) {
                    const lat = Number(origin.latitude);
                    const lng = Number(origin.longitude);
                    pts.push([lat, lng]);
                    L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: '',
                            html: `<div style="width:14px;height:14px;border-radius:50%;background:${c.color};border:2px solid #fff;box-shadow:0 0 8px ${c.color}88"></div>`,
                            iconSize: [14,14], iconAnchor: [7,7],
                        })
                    }).addTo(map).bindPopup(`
                    <div style="font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6">
                        <strong style="color:${c.color}">${profile.displayName || c.label}</strong><br>
                        <span style="color:#888">Origine:</span> ${origin.name}, ${origin.city}<br>
                        <span style="color:#888">Destinație:</span> ${dest.name}, ${dest.city}<br>
                        <span style="color:${s.color}">&bull; ${s.label}</span><br>
                        <span style="color:#888">Temp:</span> ${profile.tempMinCelsius}&deg;C &ndash; ${profile.tempMaxCelsius}&deg;C
                    </div>`);
                }

                // Destinație marker
                if (dest.latitude && dest.longitude) {
                    const lat = Number(dest.latitude);
                    const lng = Number(dest.longitude);
                    pts.push([lat, lng]);
                    L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: '',
                            html: `<div style="width:10px;height:10px;border-radius:50%;background:${c.color}66;border:2px dashed ${c.color}"></div>`,
                            iconSize: [10,10], iconAnchor: [5,5],
                        })
                    }).addTo(map).bindPopup(`<div style="font-family:'DM Sans',sans-serif;font-size:13px">Destinație: ${dest.name}, ${dest.city}</div>`);
                }

                // Linie între origine și destinație
                if (origin.latitude && origin.longitude && dest.latitude && dest.longitude) {
                    L.polyline([
                        [Number(origin.latitude), Number(origin.longitude)],
                        [Number(dest.latitude), Number(dest.longitude)]
                    ], {
                        color: c.color, weight: 2, opacity: 0.5,
                        dashArray: t.status === 'IN_TRANSIT' ? '8 6' : '4 4',
                    }).addTo(map);
                }
            });
            if (pts.length) map.fitBounds(pts, { padding: [40,40] });
        }, 50);
    }

    // ─── RENDER HELPERS ──────────────────────────────────────
    function statCard(icon, label, value, color, sub) {
        return `<div class="stat-card">
        <div class="glow" style="background:${color}08"></div>
        <div class="stat-header">
            <div style="color:${color};opacity:0.8">${icon}</div>
            <span class="stat-label">${label}</span>
        </div>
        <div class="stat-value">${value}</div>
        ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
    </div>`;
    }

    // Versiune compactă pentru panoul Overview
    function alertRowCompact(a) {
        const s = SEV_CFG[a.severity] || SEV_CFG.LOW;
        const time = a.createdAt ? new Date(a.createdAt).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}) : '';
        const tName = a.transport?.resourceProfile?.displayName || a.transport?.resourceProfile?.category || '';
        // Mesaj scurt — tăiem la 80 caractere
        const shortMsg = (a.message || 'Alertă').length > 80 ? (a.message || '').substring(0, 77) + '...' : (a.message || 'Alertă');
        return `<div class="alert-row" style="background:${s.bg};border:1px solid ${s.border};padding:10px 14px;margin-bottom:6px">
        <div class="alert-dot" style="background:${s.color};box-shadow:0 0 8px ${s.color}66"></div>
        <div class="alert-content">
            <div class="alert-msg" style="font-size:12px;margin-bottom:2px">${shortMsg}</div>
            <div class="alert-meta">
                <span class="sev" style="color:${s.color}">${a.severity}</span>
                ${tName ? `<span>${tName}</span>` : ''}
                <span>${svg.clock} ${time}</span>
            </div>
        </div>
        ${!a.acknowledged ? `<button class="btn-ack" style="border:1px solid ${s.color}44;color:${s.color};padding:4px 10px;font-size:11px" onclick="ackAlert('${a.id}')">${svg.check}</button>` : ''}
    </div>`;
    }

    // Versiune detaliată pentru pagina Alerte
    function alertRowFull(a) {
        const s = SEV_CFG[a.severity] || SEV_CFG.LOW;
        const time = a.createdAt ? new Date(a.createdAt).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}) : '';
        const tName = a.transport?.resourceProfile?.displayName || a.transport?.resourceProfile?.category || '';
        const alertTypeLabel = (a.alertType || '').replace(/_/g, ' ');
        return `<div class="alert-row" style="background:${s.bg};border:1px solid ${s.border}">
        <div class="alert-dot" style="background:${s.color};box-shadow:0 0 8px ${s.color}66"></div>
        <div class="alert-content">
            <div class="alert-msg">${a.message || 'Alertă'}</div>
            <div class="alert-meta">
                <span class="sev" style="color:${s.color}">${a.severity}</span>
                <span class="alert-type-badge">${alertTypeLabel}</span>
                ${tName ? `<span style="color:#6B7280">${tName}</span>` : ''}
                <span>${svg.clock} ${time}</span>
                ${a.triggerValue != null ? `<span>Val: ${a.triggerValue}${a.thresholdValue != null ? ' / Limită: '+a.thresholdValue : ''}</span>` : ''}
            </div>
        </div>
        ${!a.acknowledged ? `<button class="btn-ack" style="border:1px solid ${s.color}44;color:${s.color}" onclick="ackAlert('${a.id}')">${svg.check} Confirmă</button>` : ''}
    </div>`;
    }

    function transportRow(t) {
        const c = getCat(t);
        const s = getStat(t);
        const profile = rp(t);
        const origin = fo(t);
        const dest = fd(t);
        const sel = state.selectedTransport?.id === t.id;
        return `<div class="transport-row ${sel?'selected':''}" style="${sel?`border-color:${c.color}44`:''}" onclick="selectTransport('${t.id}')">
        <div class="transport-icon" style="background:${c.bg};color:${c.color}">${svg.truck}</div>
        <div class="transport-info">
            <div class="transport-name">${profile.displayName || c.label}</div>
            <div class="transport-route">${svg.pin} ${origin.city || origin.name || '?'} &rarr; ${dest.city || dest.name || '?'}</div>
        </div>
        <div class="transport-right">
            <div class="status-badge" style="color:${s.color};background:${s.bg}">${s.label}</div>
            <div class="transport-temp">${svg.thermo} ${profile.tempMinCelsius}&deg; &ndash; ${profile.tempMaxCelsius}&deg;C</div>
        </div>
    </div>`;
    }

    function transportDetail(t) {
        if (!t) return '';
        const c = getCat(t);
        const s = getStat(t);
        const profile = rp(t);
        const origin = fo(t);
        const dest = fd(t);
        const vehicle = ve(t);
        const driver = dr(t);
        const urg = getUrgency(t);

        const field = (l,v) => `<div><div class="field-label">${l}</div><div class="field-value">${v||'—'}</div></div>`;
        const fmtDate = d => d ? new Date(d).toLocaleString('ro-RO') : null;

        let telemetryHtml = '';
        if (state.telemetry.length > 0) {
            const rows = state.telemetry.slice(0,15).map((te,i) => {
                const tempVal = te.temperatureCelsius != null ? Number(te.temperatureCelsius).toFixed(1) : '—';
                const warn = te.temperatureCelsius != null && (Number(te.temperatureCelsius) > Number(profile.tempMaxCelsius) || Number(te.temperatureCelsius) < Number(profile.tempMinCelsius));
                const humidity = te.humidityPercent != null ? Number(te.humidityPercent).toFixed(0) + '%' : '';
                const speed = te.speedKmh != null ? Number(te.speedKmh).toFixed(0) + ' km/h' : '';
                const coords = te.latitude ? `${Number(te.latitude).toFixed(4)}, ${Number(te.longitude).toFixed(4)}` : '';
                return `<div class="telemetry-row ${i%2===0?'even':''}">
                <span class="telemetry-time">${new Date(te.eventTimestamp || te.receivedAt).toLocaleTimeString('ro-RO')}</span>
                <span class="telemetry-temp mono ${warn?'temp-warn':'temp-ok'}">${tempVal}&deg;C</span>
                <span class="mono" style="color:#6B7280">${humidity}</span>
                <span class="mono" style="color:#6B7280">${speed}</span>
                <span class="telemetry-coords mono">${coords}</span>
            </div>`;
            }).join('');

            telemetryHtml = `<div class="telemetry-section">
            <div class="telemetry-header">${svg.activity} Ultimele date telemetrie</div>
            <div style="display:grid;grid-template-columns:90px 70px 60px 60px 1fr;gap:8px;padding:4px 12px;font-size:11px;color:#4B5563;margin-bottom:4px">
                <span>Timp</span><span>Temp</span><span>Umid.</span><span>Viteză</span><span>Coordonate</span>
            </div>
            <div class="telemetry-list">${rows}</div>
        </div>`;
        }

        const driverName = driver.firstName ? `${driver.firstName} ${driver.lastName}` : null;

        return `<div class="detail-panel">
        <div class="detail-header">
            <div class="detail-icon" style="background:${c.bg};color:${c.color}">${svg.truck}</div>
            <div>
                <div class="detail-title">${profile.displayName || c.label}</div>
                <div class="detail-status" style="color:${s.color}">&bull; ${s.label}</div>
            </div>
        </div>
        <div class="detail-grid">
            ${field('Categorie', `${c.label} — ${profile.subtype || ''}`)}
            ${field('Urgență', `<span class="urgency" style="color:${urg.color}">${urg.label}</span>`)}
            ${field('Origine', `${origin.name}<br><span style="color:#6B7280;font-size:12px">${origin.city}${origin.county ? ', '+origin.county : ''}</span>`)}
            ${field('Destinație', `${dest.name}<br><span style="color:#6B7280;font-size:12px">${dest.city}${dest.county ? ', '+dest.county : ''}</span>`)}
            ${field('Interval temperatură', `${profile.tempMinCelsius}&deg;C &ndash; ${profile.tempMaxCelsius}&deg;C`)}
            ${field('Viabilitate max', profile.maxViabilityHours ? profile.maxViabilityHours + ' ore' : null)}
            ${field('Vehicul', vehicle.licensePlate ? `${vehicle.licensePlate} (${vehicle.vehicleType || ''})` : null)}
            ${field('Șofer', driverName)}
            ${field('Programat', fmtDate(t.scheduledAt))}
            ${field('Pornit', fmtDate(t.startedAt))}
            ${field('Livrat', fmtDate(t.deliveredAt))}
            ${field('Deadline viabilitate', fmtDate(t.viabilityDeadline))}
            ${t.estimatedDistanceKm ? field('Distanță estimată', t.estimatedDistanceKm + ' km') : ''}
            ${t.estimatedDurationMin ? field('Durată estimată', t.estimatedDurationMin + ' min') : ''}
        </div>
        ${t.notes ? `<div style="margin-top:12px;padding:12px;background:#0D0F14;border-radius:8px;font-size:12px;color:#6B7280"><strong style="color:#9CA3AF">Note:</strong> ${t.notes}</div>` : ''}
        ${telemetryHtml}
    </div>`;
    }

    // ─── MAIN RENDER ─────────────────────────────────────────
    function render() {
        const main = document.getElementById('main-content');
        const s = state.stats;
        const active = state.transports.filter(t => t.status === 'IN_TRANSIT');
        const critical = state.alerts.filter(a => a.severity === 'CRITICAL');

        let html = '';

        // Stats row
        if (state.currentView === 'overview' || state.currentView === 'transports') {
            html += `<div class="stats-row">
            ${statCard(svg.truck, 'Transporturi active', s?.activeTransports||0, '#10B981', 'în tranzit acum')}
            ${statCard(svg.alert, 'Alerte neconfirmate', s?.unacknowledgedAlerts||0, '#EF4444', `${critical.length} critice`)}
            ${statCard(svg.activity, 'Total transporturi', s?.totalTransports||0, '#3B82F6', 'din baza de date')}
            ${statCard(svg.building, 'Facilități', s?.totalFacilities||0, '#8B5CF6', 'spitale & centre')}
            ${statCard(svg.car, 'Vehicule', s?.totalVehicles||0, '#F59E0B', 'în flotă')}
        </div>`;
        }

        // Overview
        if (state.currentView === 'overview') {
            html += `<div class="overview-grid">
            <div class="panel map-container">
                <div class="panel-header">${svg.pin} Hartă transporturi active <span style="font-size:11px;color:#4B5563;font-weight:400">— ${active.length} în tranzit</span></div>
                <div class="map-inner"><div id="transport-map"></div></div>
            </div>
            <div class="panel">
                <div class="panel-body scroll">
                    <div style="font-size:13px;font-weight:600;color:#9CA3AF;display:flex;align-items:center;gap:8px;margin-bottom:16px">
                        ${svg.alert} Alerte recente
                        ${state.alerts.length ? `<span class="badge-count">${state.alerts.length}</span>` : ''}
                    </div>
                    ${state.alerts.length === 0
                ? '<div style="font-size:13px;color:#4B5563;text-align:center;padding:40px">Nicio alertă neconfirmată</div>'
                : state.alerts.slice(0,15).map(alertRowCompact).join('')}
                </div>
            </div>
        </div>`;
        }

        // Transports
        if (state.currentView === 'transports') {
            html += `<div class="transports-grid ${state.selectedTransport ? 'with-detail' : ''}">
            <div>
                <div class="section-header">${svg.truck} Toate transporturile (${state.transports.length})</div>
                ${state.transports.map(transportRow).join('')}
            </div>
            ${state.selectedTransport ? `<div>${transportDetail(state.selectedTransport)}</div>` : ''}
        </div>`;
        }

        // Alerts
        if (state.currentView === 'alerts') {
            const displayAlerts = state.showAcknowledged ? state.allAlerts : state.alerts;
            const toggleLabel = state.showAcknowledged ? 'Arată doar neconfirmate' : 'Arată și confirmate';
            const toggleColor = state.showAcknowledged ? '#10B981' : '#6B7280';
            html += `<div style="max-width:700px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                <div class="section-header" style="margin-bottom:0">${svg.alert} ${state.showAcknowledged ? 'Toate alertele' : 'Alerte neconfirmate'} (${displayAlerts.length})</div>
                <button onclick="toggleAcknowledged()" style="background:#1A1D26;border:1px solid #2E3040;border-radius:8px;padding:6px 14px;color:${toggleColor};cursor:pointer;font-size:12px;font-family:inherit;display:flex;align-items:center;gap:5px">
                    <span style="width:8px;height:8px;border-radius:50%;background:${toggleColor}"></span>
                    ${toggleLabel}
                </button>
            </div>
            ${displayAlerts.length === 0
                ? '<div class="empty-state">Toate alertele au fost confirmate ✓</div>'
                : displayAlerts.map(a => {
                    if (a.acknowledged) {
                        const s = SEV_CFG[a.severity] || SEV_CFG.LOW;
                        const time = a.createdAt ? new Date(a.createdAt).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}) : '';
                        const tName = a.transport?.resourceProfile?.displayName || a.transport?.resourceProfile?.category || '';
                        const alertTypeLabel = (a.alertType || '').replace(/_/g, ' ');
                        const ackTime = a.acknowledgedAt ? new Date(a.acknowledgedAt).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}) : '';
                        return `<div class="alert-row" style="background:#111318;border:1px solid #1E2028;opacity:0.7">
                            <div class="alert-dot" style="background:#4B5563"></div>
                            <div class="alert-content">
                                <div class="alert-msg" style="color:#6B7280;text-decoration:line-through">${a.message || 'Alertă'}</div>
                                <div class="alert-meta">
                                    <span style="color:#4B5563">${a.severity}</span>
                                    <span class="alert-type-badge">${alertTypeLabel}</span>
                                    ${tName ? `<span style="color:#4B5563">${tName}</span>` : ''}
                                    <span>${svg.clock} ${time}</span>
                                    <span style="color:#10B981">✓ ${a.acknowledgedBy || ''} ${ackTime}</span>
                                </div>
                            </div>
                        </div>`;
                    }
                    return alertRowFull(a);
                }).join('')}
        </div>`;
        }

        main.innerHTML = html;

        if (state.currentView === 'overview') renderMap(active);
    }

    // ─── NAV TABS ────────────────────────────────────────────
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            state.currentView = tab.dataset.view;
            state.selectedTransport = null;
            state.telemetry = [];
            render();
        });
    });

    // ─── REFRESH BUTTON ──────────────────────────────────────
    document.getElementById('btn-refresh').addEventListener('click', fetchAll);

    // ─── INIT ────────────────────────────────────────────────
    fetchAll();
</script>
</body>
</html>
